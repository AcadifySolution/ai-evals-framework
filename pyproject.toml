[build-system]\nrequires = ["setuptools>=68"]\nbuild-backend = "setuptools.build_meta"\n\n[project]\nname = "ai-evals-framework"\nversion = "1.0.0"\ndescription = "Production-oriented framework for repeatable LLM evaluations"\nreadme = "README.md"\nauthors = [{name = "Acadify Solution", email = "info@acadifysolution.com"}]\nlicense = {text = "MIT"}\nrequires-python = ">=3.10"\ndependencies = ["pydantic>=2,<3", "openai>=1,<3", "numpy>=1.24,<3", "pandas>=2,<3", "python-dotenv>=1,<2", "nltk>=3.8,<4", "jinja2>=3,<4", "requests>=2.31,<3", "scikit-learn>=1.4,<2"]\n\n[project.optional-dependencies]\ndev = ["pytest>=8,<9", "black>=24,<26", "ruff>=0.6,<1"]\n\n[project.scripts]\nai-evals = "evals.runner:main"\n\n[tool.ruff]\nline-length = 100\ntarget-version = "py310"\n\n[tool.black]\nline-length = 100\ntarget-version = ["py310"]\n\n[tool.pytest.ini_options]\ntestpaths = ["tests"]\npythonpath = ["."]\n