[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evals-framework"
version = "1.0.0"
description = "Production-oriented framework for repeatable LLM evaluations"
readme = "README.md"
authors = [{name = "Acadify Solution", email = "info@acadifysolution.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "openai>=1,<3", "numpy>=1.24,<3", "pandas>=2,<3", "python-dotenv>=1,<2", "nltk>=3.8,<4", "jinja2>=3,<4", "requests>=2.31,<3", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "black==26.10.1", "ruff==0.17.0"]

[project.scripts]
ai-evals = "evals.runner:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["evals", "evals.*"]
